# Tuned for the small committed demo dataset (data/demo/*.csv): dense
# enough traffic per time-bin for the incident detector to have real
# signal (see docs/ASSUMPTIONS.md on bin-volume sensitivity), without
# generating an excessive incident count that would clutter the UI on
# first load. This is what regenerated data/demo/*.csv should use.

bank:
  base_failure_rate_min: 0.03
  base_failure_rate_max: 0.09
  base_latency_ms_min: 400
  base_latency_ms_max: 1500

customer:
  normally_successful_rate_min: 0.90
  normally_successful_rate_max: 0.98
  failure_prone_rate_min: 0.55
  failure_prone_rate_max: 0.75
  other_rate_min: 0.80
  other_rate_max: 0.95

incident:
  count_per_sim_days_divisor: 1
  severity_min: 0.25
  severity_max: 0.55
  duration_minutes_min: 15
  duration_minutes_max: 90

event_delivery:
  severe_delay_probability: 0.02
  severe_delay_extra_ms_min: 15000
  severe_delay_extra_ms_max: 60000
  duplicate_probability: 0.06
  out_of_order_probability: 0.10

scenario:
  late_capture_probability: 0.08
  late_capture_misleading_event_probability: 0.50
  hard_negative_probability: 0.15
